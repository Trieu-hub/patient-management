spring.application.name=patient-service
server.port=4000

spring.output.ansi.enabled=always

spring.datasource.url=jdbc:mysql://patient-service-db:3306/patient_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.root=info

spring.sql.init.mode=never

spring.jpa.defer-datasource-initialization=true

spring.sql.init.continue-on-error=true

spring.sql.init.data-locations=classpath:data.sql

spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

grpc.client.billing-service.address=static://billing-service:9090
grpc.client.billing-service.negotiationType=PLAINTEXT